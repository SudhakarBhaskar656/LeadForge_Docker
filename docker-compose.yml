services:
  backend:
    build: 
     context: ./leadforge_backend
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=${MONGO_URI}
    depends_on:
      - mongo

  frontend:
    build: 
      context: ./leadforge_frontend
    ports:
      - "5173:5173"
    depends_on:
      - leadforge_backend

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
