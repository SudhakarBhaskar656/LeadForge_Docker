name: leadforge
services:
  backend:
    image: leadbackend:latest
    build:
      context: ./leadforge_backend
      dockerfile: backend.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=${MONGO_URI}

  frontend:
    image: leadfrontend:latest
    build:
      context: ./leadforge_frontend
      dockerfile: frontend.Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend